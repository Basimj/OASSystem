name: Customer accounting pages validation

on:
  push:
    branches:
      - feature/customer-accounting-pages-responsive

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore solution
        run: dotnet restore OASSystem/OASSystem.sln
      - name: Build solution
        run: dotnet build OASSystem/OASSystem.sln --no-restore

  package-modified-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package only modified project files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mkdir -p dist/modified
          git diff --name-only --diff-filter=ACMR -z origin/main...HEAD | while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/customer-account-ui-validation.yml) continue ;;
            esac
            if [[ -f "$path" ]]; then
              mkdir -p "dist/modified/$(dirname "$path")"
              cp "$path" "dist/modified/$path"
            fi
          done
          cd dist/modified
          zip -qr ../OAS_Customer_Accounting_Pages_Modified_Files.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: OAS_Customer_Accounting_Pages_Modified_Files
          path: dist/OAS_Customer_Accounting_Pages_Modified_Files.zip
          if-no-files-found: error
