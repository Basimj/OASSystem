name: SA05 Validation

on:
  push:
    branches:
      - feature/sa-05-header-discount-commissions
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore tests
        run: dotnet restore OASSystem/OAS.Tests/OAS.Tests.csproj
      - name: Build tests and dependencies
        run: dotnet build OASSystem/OAS.Tests/OAS.Tests.csproj --no-restore -c Release
      - name: Build client and Razor UI
        run: dotnet build OASSystem/OAS.Client/OAS.Client.csproj -c Release
      - name: Run SA-05 domain tests
        run: dotnet test OASSystem/OAS.Tests/OAS.Tests.csproj --no-build -c Release --filter FullyQualifiedName~SA05HeaderDiscountAndCommissionTests
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 9.0.*
      - name: Check EF model snapshot
        run: dotnet ef migrations has-pending-model-changes --project OASSystem/OAS.Infrastructure/OAS.Infrastructure.csproj --startup-project OASSystem/OAS.API/OAS.API.csproj

  generate-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 9.0.*
      - name: Add EF Design package to startup project on runner only
        run: dotnet add OASSystem/OAS.API/OAS.API.csproj package Microsoft.EntityFrameworkCore.Design --version 9.0.21
      - name: Repair legacy salary navigation ordering on runner only
        shell: python
        run: |
          from pathlib import Path

          path = Path('OASSystem/OAS.Infrastructure/Persistence/Migrations/OasDbContextModelSnapshot.cs')
          text = path.read_text(encoding='utf-8-sig')
          marker = 'modelBuilder.Entity("OAS.Domain.Features.Employees.Entities.EmployeeSalaryStructure", b =>'
          next_marker = 'modelBuilder.Entity("OAS.Domain.Features.Employees.Entities.EmployeeSalaryStructureLine", b =>'
          needle = 'b.Navigation("Lines").UsePropertyAccessMode(PropertyAccessMode.Field);'

          starts = []
          pos = 0
          while True:
              pos = text.find(marker, pos)
              if pos < 0:
                  break
              starts.append(pos)
              pos += len(marker)

          matches = []
          for start in starts:
              end = text.find(next_marker, start)
              if end < 0:
                  continue
              segment = text[start:end]
              if needle in segment:
                  matches.append((start, end, segment))

          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one EmployeeSalaryStructure relationship block with Lines navigation, found {len(matches)}.')

          start, end, segment = matches[0]
          segment = segment.replace(needle, '', 1)
          path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
      - name: Generate temporary EF migration to refresh snapshot
        run: dotnet ef migrations add SA05SnapshotSyncTemp --project OASSystem/OAS.Infrastructure/OAS.Infrastructure.csproj --startup-project OASSystem/OAS.API/OAS.API.csproj --output-dir Persistence/Migrations
      - name: Upload generated snapshot only
        uses: actions/upload-artifact@v4
        with:
          name: sa05-generated-snapshot
          path: OASSystem/OAS.Infrastructure/Persistence/Migrations/OasDbContextModelSnapshot.cs
          if-no-files-found: error
